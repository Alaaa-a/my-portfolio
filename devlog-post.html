<script>
(function () {
  // 英文模式下先把带 data-i18n 的静态文字藏起来，等 i18n.js 换成英文再显示，避免先闪一下中文。
  // 语言判断规则要和 js/i18n.js 的 detectLang() 保持一致；3 秒兜底，脚本出问题也不会一直藏着
  try {
    var l = localStorage.getItem("alaaa-lang");
    if (l !== "en" && l !== "zh") {
      var f = (navigator.languages && navigator.languages[0]) || navigator.language || "zh";
      l = /^zh/i.test(f) ? "zh" : "en";
    }
    if (l === "en") {
      var h = document.documentElement;
      h.classList.add("i18n-pending");
      setTimeout(function () { h.classList.remove("i18n-pending"); }, 3000);
    }
  } catch (e) {}
})();
</script>
