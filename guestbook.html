<nav class="site-nav">

    <li><a data-i18n="nav.home" href="index.html">首页</a></li>

  </ul>

<main>
  <div class="page-header">
    <h1 data-i18n="h1.guestbook">留言板</h1>
    <p data-i18n="guestbook.intro">功能建议、Bug 反馈、单纯想说的话都欢迎～留言会先经过审核，通过之后才会显示在下面。</p>
  </div>

  <form class="guestbook-form" id="guestbook-form">
    <input type="text" id="gb-nickname" placeholder="昵称（选填，不填就是「匿名」）" data-i18n-placeholder="guestbook.nickname" maxlength="40" />

    <div class="guestbook-category" id="gb-category" role="radiogroup" aria-label="留言分类" data-i18n-aria="guestbook.categoryLabel">
      <button type="button" class="guestbook-category-btn active" data-value="功能建议" data-i18n="guestbook.cat.feature">功能建议</button>
      <button type="button" class="guestbook-category-btn" data-value="Bug反馈" data-i18n="guestbook.cat.bug">Bug 反馈</button>
      <button type="button" class="guestbook-category-btn" data-value="单纯想说的话" data-i18n="guestbook.cat.chat">单纯想说的话</button>
    </div>

    <textarea id="gb-message" rows="4" placeholder="想说点什么…" data-i18n-placeholder="guestbook.message" maxlength="2000" required></textarea>

    <button type="submit" id="gb-submit" data-i18n="guestbook.submit">提交留言</button>
    <p class="guestbook-feedback" id="gb-feedback" hidden></p>
  </form>

  <div class="guestbook-list" id="guestbook-list">
    <p class="tarot-hint" data-i18n="guestbook.loading">留言加载中…</p>
  </div>
</main>

<footer class="site-footer">
  <span data-i18n="footer.text">© 2026 Alaaa · 用星星和代码搭的小站</span>
</footer>
